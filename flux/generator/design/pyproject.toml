[project]
name = "flux-generation"
version = "0.1.0"
description = "Real architecture-candidate generation: an LLM proposes a whole Architecture IR document, validated, evaluated, independently checked, and conformance-checked against real RTL (docs/roadmap.md Phase 3.5, docs/decisions.md D91)."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    # architecture.py: strip_markdown_fence for LLM-proposed documents (D246 review)
    "flux-llm",
    "flux-ir",
    # rtl_bridge.py (D100): DesignSpec validation + the same lanes translator evaluators/rtl uses
    "flux-codegen-systemc-harness",
    # rtl_bridge.py (D118): the deterministic sequential wrapper the derived schedule is emitted by
    "flux-codegen-rtl-harness",
    "flux-evaluator-rtl",
    "flux-evaluator-abi",
    "flux-cli",
    "flux-calibration",
    "flux-validity",
    "flux-store",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flux_generation"]
