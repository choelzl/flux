[project]
name = "flux-codegen-systemc-harness"
version = "0.1.0"
description = "Design-agnostic build/trace/verify harness for generated SystemC modules (docs/decisions.md D39): compiles a DUT module against a deterministically-generated driver, real VCD tracing, real test-vector self-check. No LLM anywhere in this package — generation lives in flows/chia_nodes, verification lives here, independently, the same 'no shared code' discipline flows/chia_nodes/validity.py already uses for evaluated candidates."
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flux_codegen_systemc_harness"]
