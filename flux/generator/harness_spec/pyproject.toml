[project]
name = "flux-codegen-harness-spec"
version = "0.1.0"
description = "What a generated-design harness is told and what it reports, for any target language (docs/decisions.md D453): the DesignSpec a driver is generated from, the netlist a composite is wired from, and the run result a harness returns. No language in it -- flux-codegen-rtl-harness and flux-codegen-systemc-harness each own their own emission, and shared the spec by importing one another before this package existed."
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flux_codegen_harness_spec"]
