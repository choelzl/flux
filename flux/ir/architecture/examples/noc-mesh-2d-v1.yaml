# A 2D 8x8 mesh NoC (64 router nodes) — the k-ary n-cube family evaluators/booksim's real
# Booksim2 integration simulates. Same topology as Booksim2's own bundled
# examples/mesh88_lat reference config (n=2, k=8), so this example's simulated numbers are
# directly checkable against Booksim2's own documented behaviour, not invented.
#
# Paired with noc-mesh-3d-v1.yaml: same node count (64 = 8^2 = 4^3), different dimensionality —
# the direct 2D-vs-3D comparison docs/00-decisions.md D5/D6 exists to enable.
schema_version: "0.1.0"
id: noc/mesh-2d/v1
tech: {node: n28, pdk_class: open}
hierarchy:
  - level: router_fabric
    class: interconnect
    attrs: {node_count: 64}
interconnect:
  noc:
    topology: mesh
    dimensions: [8, 8]
    routing_function: dor
    num_vcs: 8
    vc_buf_size: 8
    traffic: transpose
    injection_rate: 0.005
    packet_size: 20
