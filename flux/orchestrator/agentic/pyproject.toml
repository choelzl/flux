[project]
name = "flux-search-agentic"
version = "0.1.0"
description = "LLM-driven search strategies over the flat-mapping and architecture-width spaces (docs/search.md's Strategy Protocol, docs/decisions.md D9/D12/D13)."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "flux-ir",
    "flux-evaluator-abi",
    "flux-search-exhaustive",
    "flux-search-architecture",
    "flux-llm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flux_search_agentic"]
