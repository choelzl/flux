[project]
name = "flux-search-architecture"
version = "0.1.0"
description = "Architecture-space DSE (docs/decisions.md D5): sweep array width, screen with a fast evaluator, escalate the winner through the fidelity ladder."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "flux-evaluator-abi",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flux_search_architecture"]
