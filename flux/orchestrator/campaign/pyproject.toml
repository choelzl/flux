[project]
name = "flux-search-campaign"
version = "0.1.0"
description = "Durable, resumable, multi-objective campaigns (docs/decisions.md D216): the loop that turns Flux's one-shot searches into long-horizon autonomous work."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "flux-ir",
    "flux-evaluator-abi",
    "flux-store",
    "flux-search-architecture",
    "flux-llm",
    "flux-calibration",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flux_search_campaign"]
