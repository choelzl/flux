[project]
name = "flux-search-exhaustive"
version = "0.1.0"
description = "Exhaustive flat-mapping search strategy (docs/search.md's Strategy Protocol)."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "flux-ir",
    "flux-evaluator-abi",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flux_search_exhaustive"]
