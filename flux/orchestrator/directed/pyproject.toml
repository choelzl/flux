[project]
name = "flux-directed-search"
version = "0.1.0"
description = "A model-directed search loop over an application-registered action menu"
requires-python = ">=3.11"
dependencies = ["flux-llm"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flux_directed_search"]
