[project]
name = "flux-decide"
version = "0.1.0"
description = "The shared decision arithmetic: corners with deterministic tie-breaks, the normalized knee, and the target-and-floor rule (docs/decisions.md D397 phase 3)."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flux_decide"]
