# A real, single-token LLM decode-mode attention QK^T workload (docs/decisions.md D63) — the
# flagship case of the "LLM workload features" item (KV-cache
# growth, dynamic sequence length): S=1 (a single new query token, the real decode-mode shape
# once prefill has completed) and D=64 (a real, modest head dim) are fixed; T (the KV-cache
# length accumulated so far) is genuinely dynamic — declared, not silently picked, via a
# {dyn: [lo, hi]} bound, same convention llama3-8b-decode-layer0.yaml already established.
#
# Deliberately NOT directly evaluable by any evaluator as-is (T isn't a static int): an evaluator
# refuses it until a caller resolves T to a concrete value. It is here as the schema's example of
# a declared dynamic bound and its distribution.
schema_version: "0.1.0"
id: llm-decode/attn-qk0
provenance:
  source: handwritten
  importer: flux-manual@0.1
tensors:
  - {name: Q, rank: [S, D], dtype: int8}
  - {name: K, rank: [T, D], dtype: int8}
  - {name: O, rank: [S, T], dtype: int16}
ops:
  - id: attn.qk
    kind: einsum
    expr: "S D, T D -> S T"
    bounds: {S: 1, D: 64, T: {dyn: [1, 4096]}}
    precision: {I: 8, W: 8, O: 16, O_final: 8}
dynamism:
  symbolic_dims: [T]
