# Same shape as simple-npu-1d-v1.yaml, half the array width — exists specifically to give
# calibration/ more than one real (workload, architecture) data point where both
# evaluators/zigzag and evaluators/timeloop succeed, so cross-model residual statistics aren't
# computed from a single sample. See docs/calibration-report.md.
schema_version: "0.1.0"
id: simple-npu-1d/v2
tech: {node: n28, pdk_class: open}
hierarchy:
  - level: dram
    class: memory
    attrs: {size_kb: 1048576}
  - level: gbuf
    class: memory
    attrs: {size_kb: 512}
  - level: pe_array
    class: compute
    attrs: {dims: {X: 4}}
constraints:
  - {kind: area_mm2, max: 2.0}
  - {kind: tdp_w, max: 1.0}
