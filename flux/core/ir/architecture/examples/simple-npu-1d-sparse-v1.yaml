# simple-npu-1d-v1.yaml's own exact hierarchy, with a real, declared hardware gating
# optimization on `gbuf` (docs/decisions.md D78): reads of `W`/`O` are gated when the
# corresponding element of `I` (this architecture's own declared-sparse input activation
# tensor, see ir/workload/examples/mlp-gemm0-sparse-v1.yaml) is zero — the same real Timeloop
# `sparse_optimizations.action_optimization` mechanism, verified by hand before this translator
# was trusted (a real 4x cycle count reduction and ~2.6x energy reduction at 0.25 hypergeometric
# density on the gated tensor, see evaluators/timeloop/architecture_translator.py's own module
# docstring). `type: gating` is the only supported v0.1 action-optimization type — `skipping`/
# `spatial-skipping` are untested against this repo's own pinned Docker image.
schema_version: "0.1.0"
id: simple-npu-1d-sparse/v1
tech: {node: n28, pdk_class: open}
hierarchy:
  - level: dram
    class: memory
    attrs: {size_kb: 1048576}
  - level: gbuf
    class: memory
    attrs:
      size_kb: 512
      sparse_optimizations:
        - type: gating
          target: W
          condition_on: [I]
        - type: gating
          target: O
          condition_on: [I]
  - level: pe_array
    class: compute
    attrs: {dims: {X: 8}}
constraints:
  - {kind: area_mm2, max: 4.0}
  - {kind: tdp_w, max: 2.0}
