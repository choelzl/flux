# Same shape as simple-npu-1d-v{1,2,3}.yaml, a fourth width — deliberately kept OUT of the
# calibration store's training data (see docs/calibration-report.md) so calibrate_result()'s
# out-of-sample / extrapolation behaviour can be demonstrated against a real held-out point,
# not a fabricated one.
schema_version: "0.1.0"
id: simple-npu-1d/v4
tech: {node: n28, pdk_class: open}
hierarchy:
  - level: dram
    class: memory
    attrs: {size_kb: 1048576}
  - level: gbuf
    class: memory
    attrs: {size_kb: 512}
  - level: pe_array
    class: compute
    attrs: {dims: {X: 32}}
constraints:
  - {kind: area_mm2, max: 16.0}
  - {kind: tdp_w, max: 8.0}
