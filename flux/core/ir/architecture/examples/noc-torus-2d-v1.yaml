# A 2D 8x8 torus NoC (64 router nodes) — Booksim2's own bundled `examples/torus88` reference
# config (its own manual's worked example, docs/manual.tex §"Running a simulation"), not
# invented. Every field left unset here (`vc_buf_size`, `packet_size`) matches Booksim2's own
# internal defaults exactly (`booksim_config.cpp`) — the same defaults `examples/torus88` itself
# relies on rather than overriding — so this is the one reference config Flux's current
# `interconnect.noc` scope (no router-pipeline fields — see `evaluators/booksim/README.md`) can
# reproduce exactly, unlike `noc-mesh-2d-v1.yaml`'s `examples/mesh88_lat` target, which sets
# several router-pipeline parameters (`input_speedup`, `credit_delay`, ...) this IR has nowhere
# to carry (docs/decisions.md D25).
#
# Verified deterministic, not stochastic noise: raw Booksim2 (current HEAD) gives the exact same
# 33.6559-cycle average packet latency across repeated runs of `examples/torus88` unmodified —
# close to but not identical to the value the manual itself documents (33.6964, likely written
# against an older Booksim2 revision; a real, small, quantified tool-version drift, not something
# this repo's own adapter or translator introduces).
schema_version: "0.1.0"
id: noc/torus-2d/v1
tech: {node: n28, pdk_class: open}
hierarchy:
  - level: router_fabric
    class: interconnect
    attrs: {node_count: 64}
interconnect:
  noc:
    topology: torus
    dimensions: [8, 8]
    routing_function: dim_order
    num_vcs: 2
    traffic: uniform
    injection_rate: 0.15
