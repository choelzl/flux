# Purpose-built as the common denominator both evaluators/zigzag's and evaluators/timeloop's
# Architecture IR translators can consume. Historical note: created when Timeloop's translator
# only modelled a single spatial `meshX` container; since docs/decisions.md D215 Timeloop also
# consumes the 2-D simple-npu-v1.yaml, so this is no longer the *only* shared architecture —
# but the golden baselines pinned against it (tests/golden/) keep it load-bearing.
# See docs/phase1-exit-criterion-report.md.
schema_version: "0.1.0"
id: simple-npu-1d/v1
tech: {node: n28, pdk_class: open}
hierarchy:
  - level: dram
    class: memory
    attrs: {size_kb: 1048576}   # 1 GiB, effectively unconstrained at this problem scale
  - level: gbuf
    class: memory
    attrs: {size_kb: 512}
  - level: pe_array
    class: compute
    attrs: {dims: {X: 8}}
constraints:
  - {kind: area_mm2, max: 4.0}
  - {kind: tdp_w, max: 2.0}
