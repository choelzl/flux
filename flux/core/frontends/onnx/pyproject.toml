[project]
name = "flux-frontend-onnx"
version = "0.1.0"
description = "ONNX <-> Flux Workload IR frontend/exporter, MatMul/Gemm-chain graphs only (docs/architecture.md L1, docs/decisions.md D81)."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "flux-ir",
    "onnx>=1.14",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flux_frontend_onnx"]
