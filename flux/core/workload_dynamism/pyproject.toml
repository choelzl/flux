[project]
name = "flux-workload-dynamism"
version = "0.1.0"
description = "Real, honest cost estimation for a Workload IR op with a declared dynamic bound (docs/gap-analysis.md G5, docs/roadmap.md Phase 5 LLM workload features)."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "flux-ir",
    "flux-evaluator-abi",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flux_workload_dynamism"]
