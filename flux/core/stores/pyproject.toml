[project]
name = "flux-store"
version = "0.1.0"
description = "Content-addressed result/artifact store for Flux IR documents and Evaluator results (docs/stores.md)."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "flux-ir",
    "flux-evaluator-abi",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flux_store"]
