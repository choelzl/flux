[project]
name = "flux-frontend-onnx"
version = "0.1.0"
description = "ONNX -> Flux Workload IR frontend, MatMul/Gemm-chain graphs only (docs/04.md §2 L1)."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "flux-ir",
    "onnx>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flux_frontend_onnx"]
