[project]
name = "flux-evaluator-timeloop"
version = "0.1.0"
description = "Timeloop+Accelergy backend adapter for the Flux Evaluator ABI, run via Docker (docs/04.md §4.4)."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "flux-ir",
    "flux-evaluator-abi",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flux_evaluator_timeloop"]

# reference/ lives inside src/flux_evaluator_timeloop/ (not as a sibling of src/) specifically
# so it ships as real package data in a built wheel, not just under an editable install — same
# G11 (docs/03.md, docs/05.md) fix as evaluators/ir's schemas/.
