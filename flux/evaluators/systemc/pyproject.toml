[project]
name = "flux-evaluator-systemc"
version = "0.1.0"
description = "Coarse-grain SystemC evaluator (docs/04.md §5's fidelity ladder): fast functional-correctness + timing pre-check, escalating to evaluators/rtl for cycle-accurate numbers."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "flux-ir",
    "flux-evaluator-abi",
    "flux-evaluator-rtl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flux_evaluator_systemc"]
