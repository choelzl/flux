[project]
name = "flux-knowledge-mining"
version = "0.1.0"
description = "Typed, provenance-carrying facts mined from campaign and calibration stores (docs/decisions.md D243): the Knowledge role learning from the Evaluator's own measured history."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "flux-extract",
    "flux-llm",
    "flux-store",
    "flux-calibration",
    ]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flux_knowledge_mining"]
