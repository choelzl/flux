[project]
name = "flux-protocols"
version = "0.1.0"
description = "Structured, provenance-carrying protocol facts (OBI, AXI, WISHBONE) that other Flux modules consume programmatically (docs/decisions.md D174)."
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["pyyaml", "flux-codegen-rtl-harness"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flux_protocols"]
