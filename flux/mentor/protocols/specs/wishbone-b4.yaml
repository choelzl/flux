schema_version: "0.1.0"
id: wishbone
version: "b4"
title: WISHBONE System-on-Chip Interconnect Architecture, Revision B.4
kind: bus
summary: >-
  A synchronous MASTER/SLAVE interconnect. A bus cycle is framed by CYC and qualified per-transfer
  by STB; the SLAVE terminates each transfer with exactly one of ACK, ERR or RTY. All signals are
  active high and registered on the rising edge of CLK_I.
roles: [master, slave, syscon]

provenance:
  document: wbspec_b4.pdf (WISHBONE B4 specification)
  url: https://cdn.opencores.org/downloads/wbspec_b4.pdf
  publisher: OpenCores
  licence: public-domain
  redistributable: true
  normative: true
  version_retrieved: B.4
  retrieved: "2026-08-14"
  note: >-
    Licence verified from the document itself (page 3, "Legal Notices and Disclaimers — Copyright &
    Trademark Release"), as docs/decisions.md D31 did: "Notice is hereby given that this document is
    not copyrighted, and has been placed into the public domain. It may be freely copied and
    distributed by any means." D31 verified this and then deliberately did NOT ingest WISHBONE,
    because nothing in Flux consumed bus semantics and it would have been "corpus content in search
    of a use". It named the condition for revisiting: ingest it "with that functional work". This
    module is that work — see flux_protocols.registry.resolve_ir_reference.

coverage_note: >-
  Signals are named as the specification's own MASTER-side names (section 2.2.3), because that is
  how the document lists them; the same wire appears on the SLAVE with the suffix flipped, so
  [ACK_I] on a MASTER is [ACK_O] on the SLAVE (section 1.5, "Signal Naming Conventions"). The
  driver/receiver fields carry the actual direction, so the suffix is descriptive rather than
  load-bearing here. Tag signals (TGA/TGC/TGD) are user-defined in name and operation per the
  WISHBONE DATASHEET, so only the data tags the document names explicitly are listed. Widths are
  mostly null: WISHBONE derives them from a core's port size and granularity, declared per-core in
  its DATASHEET rather than fixed by the specification, and a guessed number would be worse than an
  absent one.

parameters:
  - name: PORT_SIZE
    default: null
    allowed: [8, 16, 32, 64]
    description: >-
      Port size in bits, declared in the core's WISHBONE DATASHEET (RULE 2.15 item 7). Determines
      the DAT_I()/DAT_O() array boundaries; maximum port size is 64 bits.
    section: "2.1.1 / 2.2.2"
  - name: GRANULARITY
    default: null
    allowed: [8, 16, 32, 64]
    description: >-
      Port granularity in bits, declared in the core's WISHBONE DATASHEET (RULE 2.15 item 8).
      Determines the SEL_O() array boundaries and the low ADR_O() boundary.
    section: "2.1.1 / 2.2.3"

signals:
  # SYSCON module outputs
  - name: CLK_O
    driver: syscon
    receiver: master
    width: 1
    description: >-
      The system clock output [CLK_O] is generated by the SYSCON module. It coordinates all
      activities for the internal logic within the WISHBONE interconnect. The INTERCON module
      connects the [CLK_O] output to the [CLK_I] input on MASTER and SLAVE interfaces.
    section: "2.2.1"
  - name: RST_O
    driver: syscon
    receiver: master
    width: 1
    description: >-
      The reset output [RST_O] is generated by the SYSCON module. It forces all WISHBONE interfaces
      to restart. All internal self-starting state machines are forced into an initial state.
    section: "2.2.1"

  # Common to MASTER and SLAVE
  - name: CLK_I
    driver: syscon
    receiver: master
    width: 1
    description: >-
      The clock input [CLK_I] coordinates all activities for the internal logic within the WISHBONE
      interconnect. All WISHBONE output signals are registered at the rising edge of [CLK_I]. All
      WISHBONE input signals are stable before the rising edge of [CLK_I].
    section: "2.2.2"
  - name: RST_I
    driver: syscon
    receiver: master
    width: 1
    description: >-
      The reset input [RST_I] forces the WISHBONE interface to restart. Furthermore, all internal
      self-starting state machines will be forced into an initial state. This signal only resets the
      WISHBONE interface.
    section: "2.2.2"
  - name: DAT_I
    driver: slave
    receiver: master
    width: PORT_SIZE
    description: >-
      The data input array [DAT_I()] is used to pass binary data. The array boundaries are
      determined by the port size, with a maximum port size of 64-bits.
    section: "2.2.2"
  - name: DAT_O
    driver: master
    receiver: slave
    width: PORT_SIZE
    description: >-
      The data output array [DAT_O()] is used to pass binary data. The array boundaries are
      determined by the port size, with a maximum port size of 64-bits.
    section: "2.2.2"
  - name: TGD_I
    driver: slave
    receiver: master
    width: null
    required: false
    description: >-
      Data tag type [TGD_I()] contains information associated with the data input array [DAT_I()],
      and is qualified by signal [STB_I]. The name and operation of a data tag must be defined in
      the WISHBONE DATASHEET.
    section: "2.2.2"
  - name: TGD_O
    driver: master
    receiver: slave
    width: null
    required: false
    description: >-
      Data tag type [TGD_O()] contains information associated with the data output array [DAT_O()],
      and is qualified by signal [STB_O]. The name and operation of a data tag must be defined in
      the WISHBONE DATASHEET.
    section: "2.2.2"

  # MASTER-side signals (section 2.2.3); the same wires are the suffix-flipped SLAVE signals
  - name: ACK_I
    driver: slave
    receiver: master
    width: 1
    description: >-
      The acknowledge input [ACK_I], when asserted, indicates the normal termination of a bus cycle.
    section: "2.2.3"
  - name: ADR_O
    driver: master
    receiver: slave
    width: null
    description: >-
      The address output array [ADR_O()] is used to pass a binary address. The higher array boundary
      is specific to the address width of the core, and the lower array boundary is determined by
      the data port size and granularity. In some cases (such as FIFO interfaces) the array may not
      be present on the interface.
    section: "2.2.3"
  - name: CYC_O
    driver: master
    receiver: slave
    width: 1
    description: >-
      The cycle output [CYC_O], when asserted, indicates that a valid bus cycle is in progress. The
      signal is asserted for the duration of all bus cycles. For example, during a BLOCK transfer
      cycle there can be multiple data transfers. The [CYC_O] signal is asserted during the first
      data transfer, and remains asserted until the last data transfer.
    section: "2.2.3"
  - name: STB_O
    driver: master
    receiver: slave
    width: 1
    description: >-
      The strobe output [STB_O] indicates a valid data transfer cycle. It is used to qualify various
      other signals on the interface such as [SEL_O()]. The SLAVE asserts either the [ACK_I],
      [ERR_I] or [RTY_I] signals in response to every assertion of the [STB_O] signal.
    section: "2.2.3"
  - name: WE_O
    driver: master
    receiver: slave
    width: 1
    description: >-
      The write enable output [WE_O] indicates whether the current local bus cycle is a READ or
      WRITE cycle. The signal is negated during READ cycles, and is asserted during WRITE cycles.
    section: "2.2.3"
  - name: SEL_O
    driver: master
    receiver: slave
    width: null
    description: >-
      The select output array [SEL_O()] indicates where valid data is expected on the [DAT_I()]
      signal array during READ cycles, and where it is placed on the [DAT_O()] signal array during
      WRITE cycles. The array boundaries are determined by the granularity of a port.
    section: "2.2.3"
  - name: ERR_I
    driver: slave
    receiver: master
    width: 1
    required: false
    description: >-
      The error input [ERR_I] indicates an abnormal cycle termination. The source of the error, and
      the response generated by the MASTER is defined by the IP core supplier.
    section: "2.2.3"
  - name: RTY_I
    driver: slave
    receiver: master
    width: 1
    required: false
    description: >-
      The retry input [RTY_I] indicates that the interface is not ready to accept or send data, and
      that the cycle should be retried. When and how the cycle is retried is defined by the IP core
      supplier.
    section: "2.2.3"
  - name: STALL_I
    driver: slave
    receiver: master
    width: 1
    required: false
    description: >-
      The pipeline stall input [STALL_I] indicates that current slave is not able to accept the
      transfer in the transaction queue. This signal is used in pipelined mode.
    section: "2.2.3"
  - name: LOCK_O
    driver: master
    receiver: slave
    width: 1
    required: false
    description: >-
      The lock output [LOCK_O] when asserted, indicates that the current bus cycle is
      uninterruptible. Lock is asserted to request complete ownership of the bus.
    section: "2.2.3"

rules:
  - id: "RULE 2.30"
    text: All WISHBONE interface signals MUST use active high logic.
    section: "2.1.3"
  - id: "RULE 3.00"
    text: >-
      All WISHBONE interfaces MUST initialize themselves at the rising [CLK_I] edge following the
      assertion of [RST_I]. They MUST stay in the initialized state until the rising [CLK_I] edge
      that follows the negation of [RST_I].
    section: "3.1.2 Reset Operation"
  - id: "RULE 3.05"
    text: >-
      [RST_I] MUST be asserted for at least one complete clock cycle on all WISHBONE interfaces.
    section: "3.1.2 Reset Operation"
