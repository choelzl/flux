[project]
name = "flux-chia-nodes"
version = "0.1.0"
description = "Flux evaluators exposed as real CHIA library nodes (docs/04.md §7.1, §7.2)."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "flux-evaluator-abi",
    "flux-cli",
    "flux-search-architecture",
    "chia @ git+https://github.com/ucb-bar/chia.git",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/flux_chia_nodes"]
