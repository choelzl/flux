[project]
name = "flux-cli"
version = "0.1.0"
description = "Flux CLI: flux eval / flux import / flux replay (docs/05.md Phase 1)."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "flux-ir",
    "flux-evaluator-abi",
    "flux-store",
]
# NOTE: flux-evaluator-zigzag / flux-evaluator-timeloop / flux-evaluator-rtl / flux-evaluator-
# systemc are deliberately NOT listed here — see registry.py's module docstring. `flux import`
# and `flux replay`'s failure paths work with only the above installed; `flux eval --backend
# zigzag` needs flux-evaluator-zigzag installed separately (and likewise for timeloop/rtl/
# systemc), same as using any adapter directly.

[project.scripts]
flux = "flux_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flux_cli"]
