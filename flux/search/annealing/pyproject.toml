[project]
name = "flux-search-annealing"
version = "0.1.0"
description = "Simulated annealing search strategy over the flat-mapping space (docs/04.md §6's Strategy Protocol)."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "flux-ir",
    "flux-evaluator-abi",
    "flux-search-exhaustive",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flux_search_annealing"]
