[project]
name = "flux-calibration"
version = "0.1.0"
description = "Calibration store + residual-based CIs and domain checks for the Flux Evaluator ABI (docs/calibration.md)."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "flux-evaluator-abi",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flux_calibration"]
