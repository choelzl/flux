[project]
name = "flux-redaction"
version = "0.1.0"
description = "Real redaction layer between evaluator outputs and model context (docs/gap-analysis.md G15, docs/decisions.md D93): relative deltas and rank orderings instead of absolute PDK-derived numbers."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "flux-codegen-rtl-harness",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flux_redaction"]
