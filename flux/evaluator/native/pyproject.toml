[project]
name = "flux-evaluator-native"
version = "0.1.0"
description = "Native, in-repo roofline evaluator (docs/decisions.md D75): backed by the real flux-core Rust crate, built on first use — the first evaluator here whose cost model is genuinely native, not a wrapped external tool."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "flux-ir",
    "flux-evaluator-abi",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flux_evaluator_native"]
