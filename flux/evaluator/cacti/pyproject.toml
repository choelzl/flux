[project]
name = "flux-evaluator-cacti"
version = "0.1.0"
description = "Real, physically-grounded SRAM area/energy/timing evaluator (docs/decisions.md D35/D36): CACTI 7 via CHIA's own chia.vlsi.sram_cacti."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "flux-ir",
    "flux-evaluator-abi",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flux_evaluator_cacti"]
