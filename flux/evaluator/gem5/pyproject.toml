[project]
name = "flux-evaluator-gem5"
version = "0.1.0"
description = "Real cycle-accurate CPU simulation evaluator (docs/decisions.md D38): gem5 via CHIA's own chia.simulators.gem5."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "flux-ir",
    "flux-evaluator-abi",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flux_evaluator_gem5"]
