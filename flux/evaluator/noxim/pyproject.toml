[project]
name = "flux-evaluator-noxim"
version = "0.1.0"
description = "Real, independent second NoC evaluator (docs/decisions.md D32): 2D-mesh simulation via Noxim, for conformance-checking evaluators/booksim's winners."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "flux-ir",
    "flux-evaluator-abi",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flux_evaluator_noxim"]
