[project]
name = "flux-evaluator-stream"
version = "0.1.0"
description = "Stream (multi-core/layer-fused DSE, KU Leuven MICAS) backend adapter for the Flux Evaluator ABI (docs/decisions.md D80-D82)."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "flux-ir",
    "flux-evaluator-abi",
    "flux-evaluator-zigzag",
    "flux-frontend-onnx",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flux_evaluator_stream"]
