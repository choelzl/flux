[project]
name = "flux-evaluator-thermal"
version = "0.1.0"
description = "Real, single-die steady-state thermal evaluator (docs/decisions.md D64): 3D-ICE (EPFL ESL, GPLv3), cloned and built on first use."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "flux-ir",
    "flux-evaluator-abi",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flux_evaluator_thermal"]
