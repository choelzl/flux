[project]
name = "flux-evaluator-champsim"
version = "0.1.0"
description = "ChampSim: simulated IPC and L2 prefetch counters per trace, for an .ini of knobs or a C++ prefetcher header built in."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "flux-evaluator-abi",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flux_evaluator_champsim"]
