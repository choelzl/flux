[project]
name = "flux-evaluator-openroad"
version = "0.1.0"
description = "Real physical-design PPA (docs/decisions.md D225): Yosys + OpenROAD place ASAP7 standard cells for the same mac_array.sv evaluators/rtl simulates — measured silicon area and power, not gate-count proxies."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "flux-profile",
    # adapter.py: derive_design_spec builds the datapath it places (D246 review)
    "flux-generation",
    "flux-ir",
    "flux-evaluator-abi",
    "flux-evaluator-rtl",
    "flux-codegen-rtl-harness",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flux_evaluator_openroad"]
