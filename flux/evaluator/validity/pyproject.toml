[project]
name = "flux-validity"
version = "0.1.0"
description = "Independent validity checking for the Flux Evaluator ABI (docs/gap-analysis.md G14, docs/ir.md, docs/evaluator-abi.md)."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "flux-evaluator-abi",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flux_validity"]
