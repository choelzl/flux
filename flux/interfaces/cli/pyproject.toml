[project]
name = "flux-cli"
version = "0.1.0"
description = "Flux CLI: the `flux` command."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "flux-store",
]

[project.scripts]
flux = "flux_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flux_cli"]
