[project]
name = "flux-cli"
version = "0.1.0"
description = "Flux CLI: the `flux` command."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "flux-ir",
    "flux-evaluator-abi",
    "flux-store",
]
# The evaluator adapters (zigzag, timeloop, rtl, ...) are deliberately not listed: they are
# resolved by name through flux-evaluator-abi's registry, so `flux eval --backend zigzag` needs
# flux-evaluator-zigzag installed alongside, same as using any adapter directly.

[project.scripts]
flux = "flux_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flux_cli"]
