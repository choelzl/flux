# No model: render.py writes one candidate per point of `space:`; the fastest wins.
#     flux task run __NAME__ --passes 6      # a pass a point (D738)

statement: >-
  The fastest way, among those render.py spells, to count the primes below n in Python.
language: python

flow:
  orchestrate:
    policy: sweep  # or gradient, anneal, genetic, pareto
    space:
      # list_sieve: a list of flags, crossed out one multiple at a time; slice_sieve: a bytearray,
      # crossed out a slice at a time; odd_sieve: the same over odd numbers only (half the memory)
      algorithm: [list_sieve, slice_sieve, odd_sieve]
      wheel: [0, 1]                         # skip even trial factors (list_sieve only; the others ignore it)
  generate: {command: "{python} {home}/render.py {artifact} {algorithm} {wheel}"}
  test:
    test: {run: "{python} {home}/check.py {artifact}", timeout_s: 60}
  measure:
    bench:
      command: "{python} {home}/bench.py {artifact}"
      metrics: [time_ms]

objectives:
  - {metric: time_ms, direction: minimize}

budget: {steps: 1}
