[project]
name = "flux-presets"
version = "0.1.0"
description = "Flux's prebuilt check and measurement commands: the golden test, RTL lint and ORFS measurement, program time/count/size, a Python bench, ChampSim (docs/decisions.md D968)"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flux_presets"]
