[pytest]
testpaths = tests
# D531 (review step 14): the unit CORE is what `pytest tests/unit` runs; the tests that run
# real tools (Verilator, yosys, OpenROAD) or a whole study are `heavy`, on demand:
#     python -m pytest tests/unit -m heavy -n auto
addopts = -m "not heavy"
markers =
    heavy: runs real tools or a whole study; excluded by default, run with -m heavy
