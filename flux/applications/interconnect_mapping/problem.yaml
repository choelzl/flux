# A banked L1's map policy and switching fabric, as a Pareto front over four costs on holdout
# traffic. The world is `flux_imapping`.
#     flux task run applications/interconnect_mapping --db demo-imapping.db --tui

statement: >-
  A banked L1 -- 32 single-ported banks of 128-bit rows under 28 read and 24 write ports --
  serving tensors in twelve storage modes, written with one tile shape and read with another:
  the map policy (bank hash, placement, schedule) and the switching fabric that together form
  the Pareto front over area, storage padding, average access latency and throughput, judged
  on holdout traffic, with conflict-freedom proved by exhaustion where it is claimed.

world: flux_imapping.world:World
params:
  seed: 0                     # train and holdout traffic use disjoint ranges of it
  ops: 8                      # MU operations per workload
  vu_probability: 0.7
  dma_probability: 0.6
  climb_rounds: 40            # XOR-tap hill-climb rounds; 0 = the curated field only
  llm_rounds: 0               # model-proposed hash rounds
  coordination_rounds: 2
  certify_tiles: [[8, 4, 1], [4, 16, 1]]
  bank_bits: 5

flow:
  measure:
    analytic: {metrics: [area_score, pad_fraction, holdout_latency, holdout_throughput, train_latency]}
    phys: {metrics: [area_score, pad_fraction, holdout_latency, holdout_throughput, area_um2, worst_slack_ps], needs: [yosys, openroad]}
  select: {finalists: 6}

objectives:                   # no goal, all four balanced: the decision is the front's knee (D658)
  - {metric: area_score, direction: minimize, unit: areaU, balance: true}
  - {metric: pad_fraction, direction: minimize, balance: true}
  - {metric: holdout_latency, direction: minimize, unit: cy, balance: true}
  - {metric: holdout_throughput, direction: maximize, unit: rows/cy, balance: true}


budget:
  steps: 4                    # 1 + llm_rounds + coordination_rounds + 1
  prototype: false
