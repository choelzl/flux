[project]
name = "flux-prefetcher"
version = "0.1.0"
description = "Bingo L2 prefetcher configuration space, storage model and search (docs/decisions.md D349)."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "flux-profile",
    "flux-feedback",]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flux_prefetcher"]
