# A signed 8x8 multiplier from a prompt and a golden model; no code of its own.
#     flux task run applications/mul8 [--screen-only]

statement: >-
  A combinational signed 8x8 -> 16-bit multiplier in SystemVerilog: module `mul8` with inputs
  `a` and `w` (`input logic signed [7:0]`) and output `p` (`output logic signed [15:0]`), the
  smallest that makes 1600 MHz placed on ASAP7.
contract: >-
  One module named exactly `mul8`, purely combinational, synthesizable SystemVerilog (logic,
  assign, always_comb; no $ system tasks, no initial blocks). p must equal a * w as signed
  integers for every input.

flow:
  test: flux rtl test {artifact} --golden {home}/golden.py
  measure:
    screen: flux rtl measure {artifact} --stage synth --clock-ps 625
    confirm: flux rtl measure {artifact} --stage place --clock-ps 625
  select: {finalists: 2}
  knowledge: off      # D867: the shared library is the NLU's papers, none of them about a multiplier

objectives:
  - {metric: fmax_mhz, direction: maximize, goal: 1600}
  - {metric: area_um2, direction: minimize}

budget:
  steps: 4
  repair_attempts: 6
  prototype: false
