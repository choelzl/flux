# The FP16 gelu: one sub-loop of the NLU (D802) -- this folder says only what differs from
# ../../problem.yaml: the statement, the contract, the golden model beside it.
statement: >-
  A purely combinational SystemVerilog module `gelu_fp16` computing 0.5*x*(1+erf(x/sqrt(2))) for an IEEE 754
  binary16 (FP16) input `x`, its FP16 result `y`: within 1 ULP of the correctly rounded
  reference on ALL 65536 inputs, as fast and small as possible on ASAP7.
contract: |-
  One module named exactly `gelu_fp16`, combinational (no clock or reset):
    - input  logic [15:0] x
    - output logic [15:0] y
  `y` is within 1 ULP of the FP16 rounding of 0.5*x*(1+erf(x/sqrt(2))) computed in double precision. A NaN input
  gives a NaN; -Inf gives -0, +Inf gives +Inf.
