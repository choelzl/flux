# The MAC processing element as a PROBLEM DOCUMENT (docs/decisions.md D533, review step 5.4).
#
# What is searched is inside the PE: how each product is formed (behavioral, shift-and-add
# array, radix-4 Booth, Wallace, plus anything a model invented), how the products are reduced
# (chain, tree, carry-save), how deep the pipeline is, and the mapper's recipe. Every design
# is generated by code, verified by Verilator, screened by synthesis + static timing, and the
# finalists along the fmax-vs-area frontier are placed. The world -- the generator, the
# golden vectors, the measurer and its cache, the decision rule -- is `flux_macarray`.
#
#     nix develop .#physical --command flux task run applications/macarray/macarray.problem.yaml --db demo-macarray.db
#
# That IS the DSE (D551): every pass screens the space, then runs `steps - 1` invention rounds
# in which a model writes a new multiplier, repairs it from the failing vector up to
# `repair_attempts` times, and -- once a PE makes the clock -- is asked for a SMALLER one that
# still makes it (D543); a kept multiplier joins the space and is screened with the rest. The
# document says `passes: 0`: it runs until `flux stop` (or q in the TUI). `--passes 1` for one
# pass, `--steps 1` for the screen alone.
#
# Another ask -- 16 lanes, a 1.5 GHz target, the incumbent's own clock preserved -- is a copy
# of this file with those numbers changed and its own `campaign:`.

id: macarray
statement: >-
  One MAC processing element, 8 lanes at the workload's precision: the smallest PE that
  makes 1000 MHz placed on ASAP7, chosen from every combination of multiplier, reducer,
  pipeline depth the generator can spell, plus what a model invents.
language: systemverilog
extension: .sv

world: flux_macarray.world:World
params:
  workload: null              # a Workload IR document; the precision comes from it (default: the study's)
  lanes: 8
  accumulate: true
  target_mhz: 1000.0          # the constraint: the smallest PE that makes it
  preserve_fmax: false        # true: the incumbent's own measured clock is the floor (D366)
  clock_period_ps: null       # what the tools are constrained to; default: the target
  multipliers: [behavioral, array, booth4, wallace]
  reducers: null              # null = every reducer the generator has
  pipelines: null
  include_invented: true      # the multipliers earlier runs' models invented join the menu
  problem: null               # what you need, in words, for the inventor
  seed: 0

campaign:
  name: macarray

objectives:
  - {metric: fmax_mhz, direction: maximize, goal: 1000, unit: MHz}
  - {metric: area_um2, direction: minimize, unit: um2}

# the world measures both: yosys + OpenSTA at the screen (orders, never quotes), OpenROAD
# placement to confirm the finalists spread along the frontier plus the incumbent
stages:
  - {name: screen, metrics: [fmax_mhz, area_um2], needs: [yosys]}
  - {name: confirm, metrics: [fmax_mhz, area_um2, power_w], needs: [openroad]}

flow:
  dse: sweep                  # the DSE box (D553): every point of the space; or montecarlo, anneal, gradient, genetic

budget:
  steps: 4                    # 1 + the invention rounds per pass (a model invents a multiplier per round, D551)
  repair_attempts: 6          # the model repairs its multiplier from the failing vector this many times
  patching: true              # ... by editing it, not rewriting it
  passes: 0                   # until `flux stop` (D551); the smallest PE that makes the clock keeps shrinking
  prototype: false
  critique_rounds: 0
  finalists: 4                # placed along the frontier; 0 = the screen only
  workers: 0                  # tool runs at once; 0 = the box decides (D525)
