# No model: gen.py spells one module per point of `space:`, proved against golden.py and
# synthesised on ASAP7.
#     flux task run ./__NAME__ --passes 6      # a pass a point (D738)

statement: >-
  A 16-bit population count (module `__MODULE__`, input `a`, 5-bit output `y`): the smallest that
  makes 3000 MHz on the synthesis screen, among the architectures gen.py spells.
language: systemverilog

flow:
  orchestrate:
    policy: sweep
    space:
      arch: [behavioral, tree, lut]
      chunk: [2, 4]                         # the table size for `lut` (the others ignore it)
  generate: {command: "{python} {home}/gen.py {artifact} {arch} {chunk}"}
  test: "{python} -m flux_helpers.golden {artifact} --golden {home}/golden.py"
  measure:
    screen:
      command: "{python} -m flux_helpers.rtl measure {artifact} --stage synth --clock-ps 333"
      metrics: [fmax_mhz, area_um2, power_w, cell_count]
      needs: [yosys, openroad]

objectives:
  - {metric: fmax_mhz, direction: maximize, goal: 3000}
  - {metric: area_um2, direction: minimize}

budget: {steps: 1}
