# The FP16 non-linear unit: one loop, one design -- seven operators bundled under one select
#. ops/<op>/golden.py is each operator's reference; ./golden.py is the unit's.
#     flux task run applications/nlu --tui

statement: >-
  One purely combinational SystemVerilog unit `nlu_fp16` computing the seven operators of an FP16
  non-linear unit (recip, rsqrt, sigmoid, tanh, gelu, log, exp) under one select: each within 1
  ULP of the correctly rounded reference on ALL 65536 inputs, at 800 MHz on ASAP7 with the least
  area and power.

contract: |-
  One unit whose top module, the first in the file, is named exactly `nlu_fp16`, combinational
  (no clock or reset):
    - input  logic [2:0]  op     0 recip, 1 rsqrt, 2 sigmoid, 3 tanh, 4 gelu, 5 log, 6 exp; 7 gives 0
    - input  logic [15:0] x      an IEEE 754 binary16 (FP16) value
    - output logic [15:0] y      its FP16 result
  `y` is within 1 ULP of the FP16 rounding of the operator of x, computed in double precision; a
  NaN input gives a NaN. Sharing logic between the operators is welcome.
  recip: `y` is within 1 ULP of the FP16 rounding of 1/x computed in double precision. A NaN input
    gives a NaN; x = 0 gives Inf of x's sign; Inf gives 0 of its sign.
  rsqrt: `y` is within 1 ULP of the FP16 rounding of 1/sqrt(x) computed in double precision. A NaN input
    gives a NaN; +0 gives +Inf, -0 gives -Inf, a negative x gives NaN, +Inf gives +0.
  sigmoid: `y` is within 1 ULP of the FP16 rounding of 1/(1+exp(-x)) computed in double precision. A NaN input
    gives a NaN; -Inf gives +0, +Inf gives 1.0.
  tanh: `y` is within 1 ULP of the FP16 rounding of tanh(x) computed in double precision. A NaN input
    gives a NaN; +-Inf give +-1.0.
  gelu: `y` is within 1 ULP of the FP16 rounding of 0.5*x*(1+erf(x/sqrt(2))) computed in double precision. A NaN input
    gives a NaN; -Inf gives -0, +Inf gives +Inf.
  log: `y` is within 1 ULP of the FP16 rounding of ln(x) computed in double precision. A NaN input
    gives a NaN; +-0 give -Inf, a negative x gives NaN, +Inf gives +Inf.
  exp: `y` is within 1 ULP of the FP16 rounding of exp(x) computed in double precision. A NaN input
    gives a NaN; -Inf gives +0, +Inf gives +Inf.

language: systemverilog

objectives:                 # 3% margin on shallower stages, 3% tie band
  - {metric: fmax_mhz, direction: maximize, goal: 800, margin: 0.03, tie: 0.03}
  - {metric: area_um2, direction: minimize}
  - {metric: power_w, direction: minimize}

flow:
  search: {by: flux}    # FluxAgent chooses each pass's direction
  design: {by: claude, prototype: true}  # drafts the unit's prototype and its RTL
  check: "fluxpreset golden {artifact} --golden {home}/golden.py --module nlu_fp16"
  measure:
    synth:
      run: "fluxpreset rtl measure {artifact} --stage synth --clock-ps 1250 --timeout 1200"
      metrics: [fmax_mhz, area_um2, power_w, cell_count]
      needs: [yosys, openroad]
      timeout_s: 1300
    place:
      run: "fluxpreset rtl measure {artifact} --stage place --clock-ps 1250 --timeout 1800"
      metrics: [fmax_mhz, area_um2, power_w, cell_count]
      needs: [yosys, openroad]
      timeout_s: 1900
  knowledge:
    library:                  # read on demand (`flux library`, knowledge(query)), never pasted
      - knowledge/nlu-methods.md
      - knowledge/fp16_blocks.py   # verified FP16 decode, rounding, Horner, segment tables

budget:
  tries_per_pass: 24
  repairs_per_design: 20
