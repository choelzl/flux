site_name: Flux
site_description: >-
  Flux searches for better designs: it makes them with a script, a model or a coding agent,
  checks and measures them with real tools, and decides from your objectives.
site_url: https://choelzl.github.io/flux/
repo_url: https://github.com/choelzl/flux
repo_name: choelzl/flux
edit_uri: edit/main/website/docs/

copyright: "© 2026 Flux"

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - toc.follow
    - search.suggest
  # the web app's palette and mark: assets/flux-theme.css maps its tokens; overrides/partials/logo.html
  # draws the mark inline; the favicon is the app's own logo.svg, published by hooks.py
  favicon: assets/app/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Light mode

extra_css:
  - assets/flux-theme.css

# the loop crafter page runs the web app's configurator: its modules published from flux_web/static
hooks:
  - hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - md_in_html
  - pymdownx.superfences

# a link to a heading that is not there fails the strict build, as a missing page does
validation:
  anchors: warn

nav:
  - Home: index.md
  - Get started:
      - Install: start/install.md
      - First loop: guide/tutorial.md
      - Loop crafter: guide/loop-crafter.md
      - Write a loop with an agent: start/ask.md
  - Guides:
      - Configure: guide/build-your-own.md
      - Search and agents: guide/loop-shape.md
      - Knowledge, skills, hidden paths: guide/knowledge.md
      - Split a larger design: guide/parts.md
      - Recipes: guide/cookbook.md
      - Run, stop, resume: guide/run.md
      - Models and agents: guide/models.md
  - Web app:
      - Tour: web/index.md
      - Live: web/live.md
      - Results: web/results.md
      - Files and settings: web/files.md
      - Server and admin: web/admin.md
  - Preview app: preview.md
  - Reference:
      - Document: guide/parameters.md
      - Search policies: reference/search.md
      - Agent options: reference/agents.md
      - Commands and placeholders: reference/commands.md
      - Presets: reference/presets.md
      - CLI: reference/cli.md
      - Common refusals: reference/refusals.md
      - Glossary: reference/glossary.md
