site_name: Flux
site_description: >-
  Learn to create and configure a Flux loop: generate designs, check correctness,
  measure results, and choose search policies, agents, objectives, and budgets.
site_url: https://choelzl.github.io/flux/
repo_url: https://github.com/choelzl/flux
repo_name: choelzl/flux

copyright: "© 2026 Flux"

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - toc.follow
    - search.suggest
  # the web app's palette and mark: assets/flux-theme.css maps its tokens; overrides/partials/logo.html
  # draws the mark inline; the favicon is the app's own logo.svg, published by hooks.py
  favicon: assets/app/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Light mode

extra_css:
  - assets/flux-theme.css

# the loop crafter page runs the web app's configurator: its modules published from flux_web/static
hooks:
  - hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Build a loop:
      - First loop: guide/tutorial.md
      - Configure: guide/build-your-own.md
      - Search and agents: guide/loop-shape.md
      - Loop crafter: guide/loop-crafter.md
  - Reference:
      - Document reference: guide/parameters.md
      - Run and results: guide/run.md
