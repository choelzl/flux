site_name: Flux
site_description: >-
  Learn to create and configure a Flux loop: generate designs, check correctness,
  measure results, and choose search policies, agents, objectives, and budgets.
site_url: https://choelzl.github.io/flux/
repo_url: https://github.com/choelzl/flux
repo_name: choelzl/flux

copyright: "© 2026 Flux"

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - toc.follow
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Build a loop:
      - Create your first loop: guide/tutorial.md
      - Configure a loop: guide/build-your-own.md
      - Search and agents: guide/loop-shape.md
      - Loop crafter: guide/loop-crafter.md
  - Reference:
      - Parameters: guide/parameters.md
      - Run and results: guide/run.md
