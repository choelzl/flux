site_name: Flux
site_description: >-
  Flux searches for the best hardware design for a problem you describe: a model or a script
  proposes designs, real tools check and measure them.
site_url: https://choelzl.github.io/flux/
repo_url: https://github.com/choelzl/flux
repo_name: choelzl/flux

copyright: "© 2026 Flux"

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - toc.follow
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Tutorial: guide/tutorial.md
  - Build your own: guide/build-your-own.md
  - Loop crafter: guide/loop-crafter.md
  - Run a problem: guide/run.md
  - The loop: guide/loop-shape.md
